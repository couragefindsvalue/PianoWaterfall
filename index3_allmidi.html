<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>Three.js 3D 瀑布流钢琴 - 终极曲库版</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #020205; font-family: sans-serif; }
        canvas { display: block; }

        /* 左上角控制面板 */
        #ui-panel {
            position: absolute; top: 20px; left: 20px; z-index: 10;
            background: rgba(10, 10, 20, 0.6); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 12px;
            padding: 15px; color: #fff; display: none; flex-direction: column; gap: 12px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        select {
            padding: 8px 12px; font-size: 14px; color: #fff; background: rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; outline: none;
            cursor: pointer; width: 200px;
        }
        select option { background: #111; color: #fff; }
        label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; color: #ddd; }
        input[type="checkbox"] { cursor: pointer; accent-color: #ff00aa; }

        /* 初始启动按钮 */
        #start-btn {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 15px 40px; font-size: 24px; color: #fff; background: rgba(255, 0, 127, 0.8);
            border: 1px solid rgba(255,255,255,0.3); border-radius: 30px; cursor: pointer; z-index: 20;
            backdrop-filter: blur(10px); box-shadow: 0 0 30px rgba(255, 0, 127, 0.5); transition: 0.3s;
        }
        #start-btn:hover { background: #ff007f; box-shadow: 0 0 40px #ff007f; transform: translate(-50%, -50%) scale(1.05); }
        #loading {
            position: absolute; top: 60%; left: 50%; transform: translate(-50%, -50%);
            color: #fff; font-size: 18px; z-index: 20; display: none; text-shadow: 0 0 10px #fff;
        }
    </style>
</head>
<body>
    <!-- UI 面板 -->
    <div id="ui-panel">
        <select id="song-select">
            <option value="">正在加载曲库...</option>
        </select>
        <label>
            <input type="checkbox" id="loop-check" checked> 单曲无限循环
        </label>
    </div>

    <button id="start-btn">加载音源并播放</button>
    <div id="loading">正在从云端下载高品质钢琴音源，请稍候...</div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "smplr": "https://unpkg.com/smplr/dist/index.mjs"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
        import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
        import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
        import { Soundfont } from 'smplr';

        // ================= 1. 基础场景设置 =================
        const scene = new THREE.Scene();
        (function () {
            const c = document.createElement('canvas'); c.width = 2; c.height = 512;
            const g = c.getContext('2d'); const gr = g.createLinearGradient(0, 0, 0, 512);
            gr.addColorStop(0, '#120a2e'); gr.addColorStop(0.5, '#07041a'); gr.addColorStop(1, '#020205');
            g.fillStyle = gr; g.fillRect(0, 0, 2, 512);
            const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
            scene.background = t;
        })();
        scene.fog = new THREE.FogExp2(0x05030f, 0.003);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 35, 85);
        camera.lookAt(0, 15, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.65;
        document.body.appendChild(renderer.domElement);

        const pmrem = new THREE.PMREMGenerator(renderer);
        scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

        // ================= 2. 光影设置 =================
        scene.add(new THREE.AmbientLight(0xffffff, 0.22));
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.9); dirLight.position.set(0, 50, 30); scene.add(dirLight);
        const rimL = new THREE.PointLight(0xff2fd2, 1400, 170, 2); rimL.position.set(-75, 10, 14); scene.add(rimL);
        const rimR = new THREE.PointLight(0x2fd6ff, 1400, 170, 2); rimR.position.set(75, 10, 14); scene.add(rimR);

        // ================= 3. 发光特效 =================
        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        composer.addPass(new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.7, 0.45, 1.0));
        composer.addPass(new OutputPass());

        // ================= 4. 构建 88 键键盘 =================
        const MIN_PITCH = 21, MAX_PITCH = 108, keyWidth = 1.5;
        const totalKeys = MAX_PITCH - MIN_PITCH + 1;
        const WHITE_TOP = 1.0, BLACK_TOP = 2.0, WHITE_NOTE_Z = 4, BLACK_NOTE_Z = -3;

        const keyboardGroup = new THREE.Group(); scene.add(keyboardGroup);
        const baseBoard = new THREE.Mesh(new THREE.BoxGeometry(totalKeys * keyWidth + 6, 4, 24), new THREE.MeshStandardMaterial({ color: 0x0a0a10, roughness: 0.4, metalness: 0.3, envMapIntensity: 0.25 }));
        baseBoard.position.set(0, -2.5, -2); keyboardGroup.add(baseBoard);
        const neonStrip = new THREE.Mesh(new THREE.BoxGeometry(totalKeys * keyWidth + 6, 0.35, 0.35), new THREE.MeshBasicMaterial({ color: 0xff3df2 }));
        neonStrip.position.set(0, -1.2, 10.15); keyboardGroup.add(neonStrip);
        const grid = new THREE.GridHelper(420, 84, 0x2a1650, 0x2a1650); grid.position.y = -4.6; grid.material.transparent = true; grid.material.opacity = 0.45; scene.add(grid);

        const whiteGeo = new RoundedBoxGeometry(keyWidth * 0.96, 1, 14, 3, 0.18);
        const blackGeo = new RoundedBoxGeometry(keyWidth * 0.6, 1.5, 8, 3, 0.2);

        function makeBeamTexture() {
            const c = document.createElement('canvas'); c.width = 64; c.height = 256;
            const g = c.getContext('2d'); const v = g.createLinearGradient(0, 0, 0, 256);
            v.addColorStop(0, 'rgba(255,255,255,0)'); v.addColorStop(1, 'rgba(255,255,255,1)');
            g.fillStyle = v; g.fillRect(0, 0, 64, 256); g.globalCompositeOperation = 'destination-in';
            const h = g.createLinearGradient(0, 0, 64, 0);
            h.addColorStop(0, 'rgba(255,255,255,0)'); h.addColorStop(0.5, 'rgba(255,255,255,1)'); h.addColorStop(1, 'rgba(255,255,255,0)');
            g.fillStyle = h; g.fillRect(0, 0, 64, 256);
            return new THREE.CanvasTexture(c);
        }
        const beamTex = makeBeamTexture();
        const BEAM_H = 18; const beamGeo = new THREE.PlaneGeometry(keyWidth * 1.1, BEAM_H);
        const keyMeshes = [];

        for (let i = 0; i < totalKeys; i++) {
            const pitch = i + MIN_PITCH;
            const isBlack = [1, 3, 6, 8, 10].includes(pitch % 12);
            const mat = isBlack
                ? new THREE.MeshPhysicalMaterial({ color: 0x14141c, roughness: 0.22, metalness: 0.0, clearcoat: 1.0, clearcoatRoughness: 0.1, envMapIntensity: 1.0, emissive: 0x000000, emissiveIntensity: 1.4 })
                : new THREE.MeshPhysicalMaterial({ color: 0xd8d8e2, roughness: 0.3, metalness: 0.0, clearcoat: 0.5, clearcoatRoughness: 0.2, envMapIntensity: 0.3, emissive: 0x000000, emissiveIntensity: 1.4 });
            const key = new THREE.Mesh(isBlack ? blackGeo : whiteGeo, mat);

            const x = (i - totalKeys / 2) * keyWidth + keyWidth / 2;
            const baseY = isBlack ? 1.25 : 0.5;
            key.position.set(x, baseY, isBlack ? -3 : 0);

            const beamMat = new THREE.MeshBasicMaterial({ map: beamTex, color: 0xffffff, transparent: true, opacity: 0, blending: THREE.AdditiveBlending, depthWrite: false });
            const beam = new THREE.Mesh(beamGeo, beamMat);
            beam.position.set(x, (isBlack ? BLACK_TOP : WHITE_TOP) + BEAM_H / 2, isBlack ? BLACK_NOTE_Z : WHITE_NOTE_Z);
            scene.add(beam);

            const idleColor = new THREE.Color(isBlack ? 0x14141c : 0xd8d8e2);
            key.userData = {
                isBlack, originalColor: idleColor.clone(), baseY: baseY,
                currentColor: idleColor.clone(), targetColor: idleColor.clone(),
                currentEmissive: new THREE.Color(0x000000), targetEmissive: new THREE.Color(0x000000),
                currentY: baseY, targetY: baseY,
                beam, beamColor: new THREE.Color(0xffffff), beamOpacity: 0
            };
            keyMeshes.push(key); keyboardGroup.add(key);
        }

        // ================= 5. 星空 & 粒子 & 冲击波 =================
        const STAR_N = 700; const starPos = new Float32Array(STAR_N * 3);
        for (let i = 0; i < STAR_N; i++) {
            starPos[i * 3] = (Math.random() - 0.5) * 360; starPos[i * 3 + 1] = -5 + Math.random() * 115; starPos[i * 3 + 2] = -140 + Math.random() * 110;
        }
        const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xaab8ff, size: 0.7, sizeAttenuation: true, transparent: true, opacity: 0.8, depthWrite: false, fog: false }));
        scene.add(stars);

        const MAX_P = 3000;
        const pPos = new Float32Array(MAX_P * 3), pVel = new Float32Array(MAX_P * 3), pCol = new Float32Array(MAX_P * 3);
        const pSize = new Float32Array(MAX_P), pAlpha = new Float32Array(MAX_P);
        const pLife = new Float32Array(MAX_P), pMaxLife = new Float32Array(MAX_P), pBase = new Float32Array(MAX_P);
        let pHead = 0;
        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3).setUsage(THREE.DynamicDrawUsage));
        pGeo.setAttribute('aColor', new THREE.BufferAttribute(pCol, 3).setUsage(THREE.DynamicDrawUsage));
        pGeo.setAttribute('aSize', new THREE.BufferAttribute(pSize, 1).setUsage(THREE.DynamicDrawUsage));
        pGeo.setAttribute('aAlpha', new THREE.BufferAttribute(pAlpha, 1).setUsage(THREE.DynamicDrawUsage));
        const pMat = new THREE.ShaderMaterial({
            uniforms: { uScale: { value: 1 } },
            vertexShader: `attribute float aSize; attribute float aAlpha; attribute vec3 aColor; varying float vAlpha; varying vec3 vColor; uniform float uScale;
                void main() { vAlpha = aAlpha; vColor = aColor; vec4 mv = modelViewMatrix * vec4(position, 1.0); gl_PointSize = aSize * uScale / -mv.z; gl_Position = projectionMatrix * mv; }`,
            fragmentShader: `varying float vAlpha; varying vec3 vColor;
                void main() { float d = length(gl_PointCoord - 0.5) * 2.0; float a = smoothstep(1.0, 0.0, d); a *= a; gl_FragColor = vec4(vColor * (1.0 + a), a * vAlpha); }`,
            transparent: true, depthWrite: false, blending: THREE.AdditiveBlending
        });
        const pPoints = new THREE.Points(pGeo, pMat); pPoints.frustumCulled = false; scene.add(pPoints);
        function updateSparkScale() { pMat.uniforms.uScale.value = renderer.domElement.height / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2))); }
        updateSparkScale();

        function spawnSpark(x, y, z, vx, vy, vz, c, size, life) {
            const i = pHead; pHead = (pHead + 1) % MAX_P; const k = i * 3;
            pPos[k] = x; pPos[k + 1] = y; pPos[k + 2] = z; pVel[k] = vx; pVel[k + 1] = vy; pVel[k + 2] = vz;
            pCol[k] = c.r; pCol[k + 1] = c.g; pCol[k + 2] = c.b;
            pBase[i] = size; pSize[i] = size; pAlpha[i] = 1; pLife[i] = life; pMaxLife[i] = life;
        }
        const burstColor = new THREE.Color();
        function burst(x, y, z, color, count) {
            for (let n = 0; n < count; n++) {
                const ang = Math.random() * Math.PI * 2; const spread = Math.random(); const speed = 14 + Math.random() * 22;
                burstColor.copy(color).lerp(white, Math.random() * 0.5);
                spawnSpark(x + (Math.random() - 0.5) * keyWidth * 0.5, y, z + (Math.random() - 0.5) * 2,
                    Math.cos(ang) * spread * speed * 0.55, speed * (0.55 + Math.random() * 0.7), Math.sin(ang) * spread * speed * 0.45,
                    burstColor, 0.25 + Math.random() * 0.4, 0.55 + Math.random() * 0.6);
            }
        }
        function updateParticles(dt) {
            for (let i = 0; i < MAX_P; i++) {
                if (pLife[i] <= 0) continue; pLife[i] -= dt;
                if (pLife[i] <= 0) { pAlpha[i] = 0; pSize[i] = 0; continue; }
                const k = i * 3; pVel[k + 1] -= 55 * dt; const drag = Math.max(1 - 1.2 * dt, 0);
                pVel[k] *= drag; pVel[k + 2] *= drag;
                pPos[k] += pVel[k] * dt; pPos[k + 1] += pVel[k + 1] * dt; pPos[k + 2] += pVel[k + 2] * dt;
                if (pPos[k + 1] < 1.1 && pVel[k + 1] < 0) { pPos[k + 1] = 1.1; pVel[k + 1] *= -0.3; }
                const t = pLife[i] / pMaxLife[i]; pAlpha[i] = t; pSize[i] = pBase[i] * (0.4 + 0.6 * t);
            }
            pGeo.attributes.position.needsUpdate = true; pGeo.attributes.aColor.needsUpdate = true; pGeo.attributes.aSize.needsUpdate = true; pGeo.attributes.aAlpha.needsUpdate = true;
        }

        const RING_N = 48, RING_LIFE = 0.45;
        const ringGeo = new THREE.RingGeometry(0.55, 0.75, 40);
        const rings = [];
        for (let i = 0; i < RING_N; i++) {
            const m = new THREE.Mesh(ringGeo, new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, side: THREE.DoubleSide, blending: THREE.AdditiveBlending, depthWrite: false }));
            m.rotation.x = -Math.PI / 2; m.visible = false; m.userData = { life: 0 }; scene.add(m); rings.push(m);
        }
        let ringHead = 0;
        function spawnRing(x, y, z, color) {
            const r = rings[ringHead]; ringHead = (ringHead + 1) % RING_N;
            r.position.set(x, y + 0.03, z); r.material.color.copy(color); r.scale.setScalar(1); r.userData.life = RING_LIFE; r.visible = true;
        }
        function updateRings(dt) {
            for (const r of rings) {
                if (!r.visible) continue; r.userData.life -= dt;
                if (r.userData.life <= 0) { r.visible = false; continue; }
                const t = 1 - r.userData.life / RING_LIFE; r.scale.setScalar(1 + t * 3.5); r.material.opacity = (1 - t) * 0.9;
            }
        }

        // ================= 6. 数据加载与场景切换 =================
        const notesGroup = new THREE.Group(); scene.add(notesGroup);
        const noteGeometry = new THREE.BoxGeometry(1, 1, 1);
        const FALL_SPEED = 32;

        let allSongsData = {};
        let currentMaxTime = 0;
        let isPlaying = false;
        let audioContext = null;
        let piano = null;
        let audioStartTime = 0;
        const noteNames = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];

        const songSelect = document.getElementById('song-select');
        const loopCheck = document.getElementById('loop-check');

        // 将音符数据渲染到 Three.js
        function buildNotes(data) {
            // 清空旧音符
            while(notesGroup.children.length > 0){
                const child = notesGroup.children[0];
                notesGroup.remove(child);
                child.geometry.dispose();
                child.material.dispose();
            }
            if (!data || data.length === 0) return;

            // 镜头自适应
            const pitches = data.map(n => n.pitch);
            const lo = Math.min(...pitches), hi = Math.max(...pitches);
            const cx = ((lo + hi) / 2 - MIN_PITCH - totalKeys / 2) * keyWidth + keyWidth / 2;
            const span = (hi - lo + 6) * keyWidth;
            const dist = span / (2 * Math.tan(THREE.MathUtils.degToRad(22.5)) * camera.aspect);
            camera.position.set(cx, 35, Math.max(dist, 55));
            camera.lookAt(cx, 10, 0);

            currentMaxTime = 0;
            data.forEach(note => {
                const hue = (note.pitch - 21) / 88 * 0.85;
                const color = new THREE.Color().setHSL(hue, 1.0, 0.55);

                const material = new THREE.MeshStandardMaterial({
                    color: color, emissive: color, emissiveIntensity: 1.5,
                    roughness: 0.35, envMapIntensity: 0.3, transparent: true, opacity: 0.95
                });
                const mesh = new THREE.Mesh(noteGeometry, material);

                const isBlackNote = [1, 3, 6, 8, 10].includes(note.pitch % 12);
                const x = (note.pitch - MIN_PITCH - totalKeys / 2) * keyWidth + keyWidth / 2;
                const z = isBlackNote ? BLACK_NOTE_Z : WHITE_NOTE_Z;
                const hitY = (isBlackNote ? BLACK_TOP : WHITE_TOP) + 0.05;

                mesh.position.set(x, 0, z);

                const blockLength = Math.max(note.duration * FALL_SPEED - 0.2, 0.8);
                mesh.scale.set(keyWidth * (isBlackNote ? 0.55 : 0.85), blockLength, isBlackNote ? 2.4 : 3);

                mesh.userData = {
                    pitch: note.pitch, start: note.start, duration: note.duration,
                    length: blockLength, hitY, z, originalColor: color.clone(),
                    hasExploded: false, hasPlayedSound: false
                };
                notesGroup.add(mesh);

                const endT = note.start + note.duration;
                if (endT > currentMaxTime) currentMaxTime = endT;
            });
        }

        // 重新计时（切歌或循环时调用）
        function resetTime() {
            if (!audioContext) return;
            notesGroup.children.forEach(mesh => {
                mesh.userData.hasExploded = false;
                mesh.userData.hasPlayedSound = false;
            });
            audioStartTime = audioContext.currentTime + 0.5; // 延迟0.5秒缓冲
        }

        // 获取曲库文件
        fetch('songs.json')
            .then(response => response.json())
            .then(data => {
                allSongsData = data;
                const songNames = Object.keys(allSongsData);
                if (songNames.length === 0) {
                    songSelect.innerHTML = '<option value="">没有找到歌曲</option>';
                    return;
                }

                // 填充下拉菜单
                songSelect.innerHTML = '';
                songNames.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name;
                    opt.textContent = name;
                    songSelect.appendChild(opt);
                });

                // 默认加载第一首歌到场景（此时不播放，只显示静态方块）
                buildNotes(allSongsData[songNames[0]]);
            })
            .catch(err => {
                console.error(err);
                songSelect.innerHTML = '<option value="">加载 songs.json 失败</option>';
            });

        // 监听下拉菜单切换
        songSelect.addEventListener('change', (e) => {
            const songName = e.target.value;
            if (allSongsData[songName]) {
                buildNotes(allSongsData[songName]);
                if (isPlaying) resetTime();
            }
        });

        // ================= 7. 音频引擎 =================
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading');
        const uiPanel = document.getElementById('ui-panel');

        startBtn.addEventListener('click', async () => {
            startBtn.style.display = 'none';
            loadingText.style.display = 'block';

            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            piano = new Soundfont(audioContext, { instrument: "acoustic_grand_piano" });

            try {
                await piano.load;
                loadingText.style.display = 'none';
                uiPanel.style.display = 'flex'; // 显示选歌面板

                audioContext.resume();
                resetTime();
                isPlaying = true;
            } catch (err) {
                loadingText.innerText = "音源加载失败，请刷新重试";
                console.error(err);
            }
        });

        // ================= 8. 动画循环 =================
        const clock = new THREE.Clock();
        const tmpColor = new THREE.Color();
        const white = new THREE.Color(0xffffff);

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const t = clock.elapsedTime;

            stars.material.opacity = 0.6 + 0.25 * Math.sin(t * 1.3);
            neonStrip.material.color.setHSL((t * 0.05) % 1, 1.0, 0.5);

            if (isPlaying && audioContext) {
                const currentTime = audioContext.currentTime - audioStartTime;

                // 【核心：自动循环】
                if (currentTime > currentMaxTime + 2 && loopCheck.checked) {
                    resetTime();
                }

                const activeColors = new Map();

                notesGroup.children.forEach(mesh => {
                    const ud = mesh.userData;
                    const timeToHit = ud.start - currentTime;

                    let bottom, len;
                    if (timeToHit > 0) {
                        bottom = ud.hitY + timeToHit * FALL_SPEED;
                        len = ud.length;
                        ud.hasExploded = false;
                        ud.hasPlayedSound = false;
                    } else {
                        bottom = ud.hitY;
                        len = ud.length + timeToHit * FALL_SPEED;
                    }

                    if (len <= 0.02) {
                        mesh.visible = false;
                    } else {
                        mesh.visible = bottom < 110;
                        mesh.scale.y = len;
                        mesh.position.y = bottom + len / 2;
                    }

                    // 触发发声
                    if (timeToHit <= 0 && !ud.hasPlayedSound) {
                        ud.hasPlayedSound = true;
                        const octave = Math.floor(ud.pitch / 12) - 1;
                        const noteName = noteNames[ud.pitch % 12] + octave;

                        if (piano) {
                            piano.start({ note: noteName, velocity: 80, time: audioContext.currentTime, duration: ud.duration });
                        }
                    }

                    // 触发爆炸特效
                    if (timeToHit <= 0 && !ud.hasExploded) {
                        ud.hasExploded = true;
                        if (-timeToHit < 0.25) {
                            burst(mesh.position.x, ud.hitY + 0.1, ud.z, ud.originalColor, Math.min(10 + Math.floor(ud.duration * 12), 24));
                            spawnRing(mesh.position.x, ud.hitY, ud.z, ud.originalColor);
                        }
                    }

                    if (currentTime >= ud.start && currentTime <= ud.start + ud.duration) {
                        activeColors.set(ud.pitch, ud.originalColor);
                    }
                });

                const lerpSpeed = Math.min(15 * delta, 0.8);
                keyMeshes.forEach((key, index) => {
                    const pitch = index + MIN_PITCH;
                    const ud = key.userData;
                    const noteColor = activeColors.get(pitch);

                    if (noteColor) {
                        tmpColor.copy(noteColor).lerp(white, ud.isBlack ? 0.0 : 0.35);
                        ud.targetColor.copy(tmpColor);
                        ud.targetEmissive.copy(noteColor);
                        ud.targetY = ud.baseY - 0.35;
                        ud.beamColor.copy(noteColor);
                        ud.beamOpacity += (0.28 - ud.beamOpacity) * lerpSpeed;

                        if (Math.random() < delta * 16) {
                            const topY = ud.isBlack ? BLACK_TOP : WHITE_TOP;
                            const kz = ud.isBlack ? BLACK_NOTE_Z : WHITE_NOTE_Z;
                            tmpColor.copy(noteColor).lerp(white, 0.3);
                            spawnSpark(key.position.x + (Math.random() - 0.5) * keyWidth * 0.6, topY + 0.2, kz,
                                (Math.random() - 0.5) * 5, 7 + Math.random() * 8, (Math.random() - 0.5) * 5,
                                tmpColor, 0.2 + Math.random() * 0.15, 0.35 + Math.random() * 0.3);
                        }
                    } else {
                        ud.targetColor.copy(ud.originalColor);
                        ud.targetEmissive.setHex(0x000000);
                        ud.targetY = ud.baseY;
                        ud.beamOpacity += (0 - ud.beamOpacity) * Math.min(8 * delta, 0.8);
                    }

                    ud.currentColor.lerp(ud.targetColor, lerpSpeed);
                    ud.currentEmissive.lerp(ud.targetEmissive, lerpSpeed);
                    ud.currentY += (ud.targetY - ud.currentY) * lerpSpeed;

                    key.material.color.copy(ud.currentColor);
                    key.material.emissive.copy(ud.currentEmissive);
                    key.position.y = ud.currentY;

                    ud.beam.material.color.copy(ud.beamColor);
                    ud.beam.material.opacity = ud.beamOpacity;
                    ud.beam.visible = ud.beamOpacity > 0.01;
                });
            }

            updateParticles(delta);
            updateRings(delta);
            composer.render();
        }

        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            updateSparkScale();
        });
    </script>
</body>
</html>
